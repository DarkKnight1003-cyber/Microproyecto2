apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-vino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-vino
  template:
    metadata:
      labels:
        app: app-vino
    spec:
      containers:
        - name: app-vino
          image: acrmicroproyecto2jea.azurecr.io/app-vino:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: app-vino-service
spec:
  type: LoadBalancer
  selector:
    app: app-vino
  ports:
    - port: 80
      targetPort: 5000